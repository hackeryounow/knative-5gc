{{ $open5gsName := .Release.Name }}
{{ $open5gsNamespace := .Release.Namespace }}
logger:
  level: {{ .Values.config.logLevel }}
#  level: info   # fatal|error|warn|info(default)|debug|trace

global:
# max:
#   ue: 1024 # The number of UE can be increased depending on memory size.
#    peer: 64

nrf:
  serving: # 5G roaming requires PLMN in NRF
    {{- range .Values.config.servingList }}
    - {{- toYaml . | nindent 6 }}
    {{- end }}
  sbi:
    server:
    - address: 0.0.0.0
      port: {{ .Values.containerPorts.sbi }}
      # Advertise the cluster-local Knative Service DNS name (reachable on port 80)
      # so NRF hands consumers a routable address instead of the ephemeral pod IP.
      advertise: {{ default (printf "%s-nrf-sbi.%s.svc.cluster.local" $open5gsName $open5gsNamespace) (dig "sbi" "server" "advertise" "" .Values.config) }}

